
<!doctype html>
<html>
    <head>
        <script src="https://aframe.io/releases/1.0.4/aframe.min.js"></script>
        <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
        <script src="https://raw.githack.com/donmccurdy/aframe-extras/master/dist/aframe-extras.loaders.min.js"></script>
        <script src="https://raw.githack.com/AR-js-org/studio-backend/master/src/modules/marker/tools/gesture-detector.js"></script>
        <script src="https://raw.githack.com/AR-js-org/studio-backend/master/src/modules/marker/tools/gesture-handler.js"></script>
    </head>

    <body style="margin: 0; overflow: hidden;">
        <a-scene
            vr-mode-ui="enabled: false;"
            loading-screen="enabled: false;"
            renderer="logarithmicDepthBuffer: true;"
            arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;"
            id="scene"
            embedded
            gesture-detector
        >
            <a-assets>
                <a-asset-item
                    id="animated-asset"
                    src="assets/asset.glb"
                ></a-asset-item>
            </a-assets>

            <a-marker
                id="animated-marker"
                type="pattern"
                preset="custom"
                url="assets/marker.patt"
                raycaster="objects: .clickable"
                emitevents="true"
                cursor="fuse: false; rayOrigin: mouse;"
                id="markerA"
            >
                <a-entity
                    id="bowser-model"
                    scale="0.047619047619047616 0.047619047619047616 0.047619047619047616"
                    animation-mixer="loop: repeat"
                    gltf-model="#animated-asset"
                    class="clickable"
                    gesture-handler
                ></a-entity>
            </a-marker>

            <a-entity camera></a-entity>
        </a-scene>

        <!-- ETIQUETA INFORMATIVA -->

        <div id="etiqueta-ico" style="
            display: none;
            position: fixed;
            bottom: 4%;
            left: 5%;
            width: 90%;
            box-sizing: border-box;
            background: rgba(0, 70, 45, 0.95);
            color: white;
            border: 2px solid white;
            border-radius: 12px;
            padding: 2.5vw;
            font-family: Arial, sans-serif;
            text-align: center;
            z-index: 2147483647;
            pointer-events: none;
        ">

            <div style="
                font-size: 4.5vw;
                font-weight: bold;
                margin-bottom: 8px;
            ">
                EDIFICIO B
            </div>

            <div style="
                font-size: 3.8vw;
                font-weight: bold;
                margin-bottom: 8px;
            ">
                Ingenier&iacute;a en Computaci&oacute;n (ICO)
            </div>

            <div style="
                font-size: 3.2vw;
                line-height: 1.4;
            ">
                Carrera enfocada en la programaci&oacute;n,
                desarrollo de software, redes,
                inteligencia artificial y sistemas
                computacionales para solucionar problemas
                mediante la tecnolog&iacute;a.
            </div>

        </div>

        <script>
            (function () {
                var marcador = document.querySelector("a-marker");
                var etiqueta = document.getElementById("etiqueta-ico");

                setInterval(function () {
                    if (!marcador || !marcador.object3D) {
                        return;
                    }

                    etiqueta.style.display =
                        marcador.object3D.visible
                        ? "block"
                        : "none";

                }, 100);
            })();
        </script>

    </body>
</html>
